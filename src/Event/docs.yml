Обязанности Event:
- Хранит тип сообщения и вычисляет его сигнатуру как sha1 от JSON типа
- Создаёт сообщение из шаблона типа и переданных данных (createMsg)
- Проверяет сообщение на соответствие типу (isValid, getValidError)
- Хранит коллбэки по идентификаторам и вызывает их с учётом лимита вызовов (on, off, call)
- Проверяет, является ли событие подтипом другого события (isSubtypeEvent)
- Умеет клонироваться и восстанавливаться из JSON (clone, fromJSON)
