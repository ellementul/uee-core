Обязанности Member:
- Хранит идентификатор (uid) и имя (name)
- Регистрирует инструменты через addTool и проверяет объявленные зависимости
- Создаёт комнату через makeRoom и предоставляет addMember/deleteMember
- Отправляет события в собственную комнату или во внешние комнаты
- Подписывает и отписывает коллбэки с фильтрацией собственных событий и дедупликацией
- Управляет внешними комнатами (setOutsideRoom, leaveRoom)
- Вызывает onJoinRoom при присоединении и onDestroy при явном destroy
- Уничтожает инструменты и выходит из внешних комнат (destroy)
- Передаёт ошибки в инструмент logging или бросает их (throwError)
